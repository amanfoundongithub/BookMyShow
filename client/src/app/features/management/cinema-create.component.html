<div class="cinema-create-container">
  <div class="cinema-header">
    <div>
      <h1 class="cinema-title">Create Cinema</h1>
      <p class="cinema-subtitle">
        Register a new cinema property before configuring halls and layouts
      </p>
    </div>
    <a routerLink="/management/halls" class="hall-builder-link">
      Go to Hall Builder →
    </a>
  </div>

  @if (errorMessage()) {
    <div class="alert-error">
      {{ errorMessage() }}
    </div>
  }

  @if (createdCinema(); as cinema) {
    <div class="alert-success">
      <div>
        Created <strong>{{ cinema.name }}</strong> (ID: <span class="cinema-id-code">{{ cinema.cinema_id }}</span>).
      </div>
      <a routerLink="/management/halls" class="configure-halls-link">
        Configure Halls
      </a>
    </div>
  }

  <form (ngSubmit)="submitCinema()" class="cinema-form-card">
    <div class="form-grid">
      <div>
        <label class="field-label">
          Cinema Name *
        </label>
        <input
          type="text"
          name="cinemaName"
          class="field-input"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          placeholder="e.g. AMB Cinemas Gachibowli"
          required
        />
      </div>

      <div>
        <label class="field-label">
          City *
        </label>
        @if (cities().length > 0) {
          <select
            name="cityId"
            class="field-input field-select"
            [ngModel]="cityId()"
            (ngModelChange)="onCitySelect($event)"
          >
            @for (city of cities(); track city.id) {
              <option [value]="city.id">{{ city.name }} ({{ city.state }})</option>
            }
          </select>
        } @else {
          <input
            type="text"
            name="cityId"
            class="field-input"
            [ngModel]="cityId()"
            (ngModelChange)="onCitySelect($event)"
            placeholder="e.g. hyd"
            required
          />
        }
      </div>

      <div>
        <label class="field-label">
          State
        </label>
        <input
          type="text"
          name="stateName"
          class="field-input"
          [ngModel]="stateName()"
          (ngModelChange)="stateName.set($event)"
          placeholder="e.g. Telangana"
        />
      </div>

      <div>
        <label class="field-label">
          Amenities (comma-separated)
        </label>
        <input
          type="text"
          name="amenities"
          class="field-input"
          [ngModel]="amenitiesInput()"
          (ngModelChange)="amenitiesInput.set($event)"
          placeholder="IMAX, Dolby Atmos, Recliner"
        />
      </div>
    </div>

    <div>
      <label class="field-label">
        Address *
      </label>
      <textarea
        name="address"
        rows="2"
        class="field-input"
        [ngModel]="address()"
        (ngModelChange)="address.set($event)"
        placeholder="Full street address and landmark"
        required
      ></textarea>
    </div>

    <div class="form-footer">
      <label class="checkbox-label">
        <input
          type="checkbox"
          name="isActive"
          class="checkbox-input"
          [ngModel]="isActive()"
          (ngModelChange)="isActive.set($event)"
        />
        Active cinema
      </label>

      <button
        type="submit"
        [disabled]="submitting()"
        class="submit-btn"
      >
        {{ submitting() ? 'Creating...' : 'Create Cinema' }}
      </button>
    </div>
  </form>
</div>
