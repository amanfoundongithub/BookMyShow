<div class="scheduler-container">
  <div class="scheduler-header">
    <h1 class="scheduler-title">Show Scheduler</h1>
    <p class="scheduler-subtitle">
      Publish shows to Catalog Service scoped to your assigned cinema and hall
    </p>
  </div>

  @if (errorMessage()) {
    <div class="alert-error">
      {{ errorMessage() }}
    </div>
  }

  @if (statusMessage()) {
    <div class="alert-success">
      {{ statusMessage() }}
    </div>
  }

  <div class="scheduler-card">
    <div class="form-grid">
      <div>
        <label class="field-label">Cinema</label>
        <select
          class="field-input field-select"
          [ngModel]="selectedCinemaId()"
          (ngModelChange)="onSelectCinema($event)"
        >
          @for (cinema of allowedCinemas(); track cinema.cinema_id) {
            <option [value]="cinema.cinema_id">{{ cinema.name }}</option>
          }
        </select>
      </div>

      <div>
        <label class="field-label">Hall</label>
        <select
          class="field-input field-select"
          [ngModel]="selectedHallId()"
          (ngModelChange)="selectedHallId.set($event)"
        >
          @for (hall of halls(); track hall.hall_id) {
            <option [value]="hall.hall_id">{{ hall.name }} ({{ hall.screen_format }})</option>
          }
        </select>
      </div>

      <div>
        <label class="field-label">Movie</label>
        @if (movies().length > 0) {
          <select
            class="field-input field-select"
            [ngModel]="selectedMovieId()"
            (ngModelChange)="onSelectMovie($event)"
          >
            @for (movie of movies(); track movie.id) {
              <option [value]="movie.id">{{ movie.title }} ({{ movie.duration_minutes }}m)</option>
            }
          </select>
        } @else {
          <input
            type="text"
            class="field-input"
            [ngModel]="selectedMovieId()"
            (ngModelChange)="selectedMovieId.set($event)"
            placeholder="e.g. mov_inception"
          />
        }
      </div>

      <div>
        <label class="field-label">Start Time</label>
        <input
          type="datetime-local"
          class="field-input"
          [ngModel]="startTimeLocal()"
          (ngModelChange)="startTimeLocal.set($event)"
        />
      </div>

      <div>
        <label class="field-label">Language</label>
        <input
          type="text"
          class="field-input"
          [ngModel]="language()"
          (ngModelChange)="language.set($event)"
        />
      </div>

      <div>
        <label class="field-label">Format</label>
        <input
          type="text"
          class="field-input"
          [ngModel]="format()"
          (ngModelChange)="format.set($event)"
        />
      </div>
    </div>

    <div class="pricing-section">
      <h2 class="pricing-heading">Tier Pricing (INR)</h2>
      <div class="pricing-grid">
        <div>
          <label class="pricing-label">Recliner (₹)</label>
          <input
            type="number"
            min="1"
            class="field-input"
            [ngModel]="reclinerPrice()"
            (ngModelChange)="reclinerPrice.set(+$event)"
          />
        </div>
        <div>
          <label class="pricing-label">Prime (₹)</label>
          <input
            type="number"
            min="1"
            class="field-input"
            [ngModel]="primePrice()"
            (ngModelChange)="primePrice.set(+$event)"
          />
        </div>
        <div>
          <label class="pricing-label">Classic (₹)</label>
          <input
            type="number"
            min="1"
            class="field-input"
            [ngModel]="classicPrice()"
            (ngModelChange)="classicPrice.set(+$event)"
          />
        </div>
      </div>
    </div>

    <div class="scheduler-footer">
      <button
        type="button"
        [disabled]="submitting()"
        (click)="createShow()"
        class="submit-btn"
      >
        {{ submitting() ? 'Scheduling...' : 'Publish Show' }}
      </button>
    </div>
  </div>
</div>
