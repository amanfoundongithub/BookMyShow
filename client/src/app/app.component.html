<div class="app-shell">
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <a routerLink="/" class="brand-link">
          <span class="brand-badge">BMS</span>
          <span class="brand-title">BookMyShow</span>
          <span class="brand-tag">DEV</span>
        </a>

        <nav class="primary-nav" aria-label="Main navigation">
          <a
            routerLink="/"
            routerLinkActive="nav-link--active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            Shows
          </a>
          <a
            routerLink="/bookings"
            routerLinkActive="nav-link--active"
            class="nav-link"
          >
            My Bookings
          </a>
        </nav>
      </div>

      <div class="session-controls">
        <div class="user-chip" [title]="authService.isAuthenticated() ? authService.userId() : 'Guest'">
          <span class="status-dot" [class.status-dot--active]="authService.isAuthenticated()"></span>
          <span class="session-user">
            @if (authService.isAuthenticated()) {
              {{ authService.currentUser()?.name || authService.userId() }}
            } @else {
              Guest
            }
          </span>
        </div>

        @if (authService.isAuthenticated()) {
          <button
            type="button"
            class="header-btn"
            (click)="logout()"
          >
            Logout
          </button>
        } @else {
          <a
            routerLink="/login"
            class="header-btn header-btn--accent"
          >
            Sign In
          </a>
        }
      </div>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
