<div class="app-shell">
  <header class="app-header">
    <div class="header-inner">
      <a routerLink="/" class="brand-link">
        <span class="brand-badge">BMS</span>
        <span class="brand-title">BookMyShow Clone</span>
      </a>

      <div class="session-controls">
        <span class="session-user">
          {{ authService.currentUser()?.name || authService.userId() }}
        </span>

        <span
          class="token-indicator"
          [class.token-indicator--set]="authService.isAuthenticated()"
        >
          {{ authService.isAuthenticated() ? 'JWT Ready' : 'Guest' }}
        </span>

        @if (authService.isAuthenticated()) {
          <button
            type="button"
            class="header-btn"
            (click)="logout()"
          >
            Logout
          </button>
        } @else {
          <a
            routerLink="/login"
            class="header-btn header-btn--accent"
          >
            Sign In
          </a>
        }
      </div>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
