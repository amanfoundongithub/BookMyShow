[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-common"
version = "0.1.0"
description = "Shared contracts, headers, and logging utilities for BookMyShow clone"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bms_common*"]